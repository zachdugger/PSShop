# Example Pixelmon Item Entries for items.yml
# These are examples you can use as references when adding your own items

# PokeBall Examples
pokeball:
  name: "&fPoké Ball"
  material: "poke_ball"
  amount: 10
  description:
    - "A device for catching"
    - "wild Pokémon."
    - "The regular Poké Ball"
    - "has a basic catch rate."
  currency: "coins"
  price: 200
  slot: 10
  pixelmon_id: "poke_ball"

greatball:
  name: "&9Great Ball"
  material: "great_ball"
  amount: 10
